[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-validator"
version = "1.0.0"
description = "Validador local de Pull Requests: codigo vs. documentacao com IA local (Ollama), sem RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pr_validator*"]

[tool.setuptools.package-data]
pr_validator = ["static/*.html"]
