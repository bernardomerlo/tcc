[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-as-code"
version = "0.1.0"
description = "Doc-as-Code CLI: Auditoria de código via IA baseada em documentação técnica (RAG)"
readme = "como-rodar.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
doc-as-code = "doc_as_code.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["doc_as_code*"]
